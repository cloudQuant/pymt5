name: Release to PyPI

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_release_tag.py

  test:
    needs: validate-release
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p pytest_asyncio.plugin tests/ -m "not integration" -v --tb=short

  quality:
    needs: validate-release
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check pymt5/ tests/
      - run: python -m mypy pymt5/ --ignore-missing-imports

  docs:
    needs: validate-release
    name: Validate bilingual documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[docs]"
      - run: python docs/build_docs.py
      - run: python docs/check_docs.py

  package:
    needs: validate-release
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - name: Remove stale build metadata and artifacts
        run: python -c "import shutil; from pathlib import Path; [shutil.rmtree(path, ignore_errors=True) for path in (Path('build'), Path('dist'), Path('mt5_web_client.egg-info'))]"
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install and smoke-test the wheel outside the source tree
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pymt5-wheel-smoke"
          "$RUNNER_TEMP/pymt5-wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/pymt5-wheel-smoke/bin/python" -c 'import os, pymt5; assert pymt5.__version__ == os.environ["EXPECTED_VERSION"], (pymt5.__version__, os.environ["EXPECTED_VERSION"]); print(f"Wheel import passed: {pymt5.__version__}")'
      - uses: actions/upload-artifact@v4
        with:
          name: pymt5-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [test, quality, docs, package]
    name: Publish verified artifacts to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pymt5-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1 (v1.14.3)
        with:
          skip-existing: true

  release:
    needs: publish
    name: Create GitHub Release with verified artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pymt5-dist
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2 (v2.6.2)
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
