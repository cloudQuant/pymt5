<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="English and Chinese documentation for pymt5, the async Python client for MT5 Web Terminal.">
  <link rel="canonical" href="https://cloudquant.github.io/pymt5/">
  <title>pymt5 Documentation · 中文文档</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { align-items: center; background: #f4f7fb; color: #1f2933; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 2rem; }
    main { background: #fff; border: 1px solid #d9e2ec; border-radius: 14px; box-shadow: 0 14px 40px rgba(31, 41, 51, .08); max-width: 720px; padding: 2.5rem; width: 100%; }
    h1 { color: #174a7e; font-size: clamp(1.8rem, 5vw, 2.5rem); margin: 0 0 .5rem; }
    p { color: #52606d; line-height: 1.65; }
    .languages { display: grid; gap: 1rem; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 2rem 0 1.5rem; }
    .language { border: 2px solid #2672b8; border-radius: 9px; color: #174a7e; font-size: 1.15rem; font-weight: 700; padding: 1.2rem; text-align: center; text-decoration: none; }
    .language:hover, .language:focus { background: #eaf3fb; outline-offset: 3px; }
    .language small { display: block; font-size: .82rem; font-weight: 400; margin-top: .45rem; }
    nav { border-top: 1px solid #d9e2ec; display: flex; flex-wrap: wrap; gap: 1.25rem; padding-top: 1.25rem; }
    nav a { color: #174a7e; }
    @media (max-width: 520px) { body { padding: 1rem; } main { padding: 1.5rem; } .languages { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>pymt5</h1>
    <p>Async Python client for MT5 Web Terminal.<br>面向 MT5 Web Terminal 的异步 Python 客户端。</p>
    <div class="languages" aria-label="Choose documentation language / 选择文档语言">
      <a class="language" href="en/" hreflang="en" lang="en" data-language-switch="en">English Documentation<small>Installation, guides, API and protocol reference</small></a>
      <a class="language" href="zh-CN/" hreflang="zh-CN" lang="zh-CN" data-language-switch="zh-CN">中文文档<small>安装、使用指南、API 与协议参考</small></a>
    </div>
    <nav aria-label="Project links / 项目链接">
      <a href="https://github.com/cloudQuant/pymt5">GitHub</a>
      <a href="https://pypi.org/project/mt5-web-client/">PyPI</a>
      <a href="https://github.com/cloudQuant/pymt5/issues">Issues / 问题反馈</a>
